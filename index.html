<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DropElite — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:        #f5c842;
  --gold-bright: #ffe066;
  --gold-dim:    #a8862a;
  --gold-glow:   rgba(245,200,66,0.18);
  --bg:          #050810;
  --bg2:         #080d1a;
  --surface:     rgba(255,255,255,0.04);
  --surface2:    rgba(255,255,255,0.07);
  --border:      rgba(245,200,66,0.15);
  --border2:     rgba(255,255,255,0.07);
  --text:        #e8eaf0;
  --text-dim:    #7a849a;
  --text-muted:  #3d4560;
  --green:       #00e87a;
  --red:         #ff4757;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: hidden;
  position: relative;
}

/* Background atmosphere */
.bg-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background:
    radial-gradient(ellipse 50% 50% at 30% 20%, rgba(245,200,66,0.10) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 80% 80%, rgba(74,240,255,0.06) 0%, transparent 60%);
}
.bg-grid {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.18;
  background-image:
    linear-gradient(rgba(245,200,66,0.15) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,200,66,0.15) 1px, transparent 1px);
  background-size: 48px 48px;
}

.login-card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 420px;
  background: linear-gradient(135deg, rgba(8,13,26,0.92) 0%, rgba(12,18,36,0.92) 100%);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 36px 32px;
  box-shadow:
    0 30px 60px rgba(0,0,0,0.5),
    0 0 0 1px rgba(245,200,66,0.05),
    inset 0 1px 0 rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: center;
  margin-bottom: 8px;
}
.brand-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
  clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 24px rgba(245,200,66,0.55);
}
.brand-icon svg { width: 22px; height: 22px; }
.brand-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 22px;
  font-weight: 900;
  letter-spacing: 3px;
  color: var(--gold);
  text-shadow: 0 0 18px rgba(245,200,66,0.5);
}

.subtitle {
  text-align: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-dim);
  margin-bottom: 28px;
  text-transform: uppercase;
}

.field {
  margin-bottom: 16px;
}
.field label {
  display: block;
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 12px 14px;
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  font-weight: 500;
  outline: none;
  transition: all 0.2s;
  min-height: 44px;
}
.field input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-glow);
  background: var(--surface2);
}

.error-msg {
  display: none;
  background: rgba(255,71,87,0.1);
  border: 1px solid rgba(255,71,87,0.3);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--red);
  font-size: 13px;
  margin-bottom: 16px;
}
.error-msg.show { display: block; }

.btn-login {
  width: 100%;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
  color: #050810;
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 48px;
  box-shadow: 0 4px 18px rgba(245,200,66,0.3);
  margin-top: 8px;
}
.btn-login:hover { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(245,200,66,0.45); }
.btn-login:active { transform: translateY(0); }
.btn-login:disabled { opacity: 0.5; cursor: wait; }

.demo-creds {
  margin-top: 22px;
  padding-top: 22px;
  border-top: 1px solid var(--border2);
}
.demo-creds-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 10px;
  text-align: center;
}
.demo-row {
  background: rgba(245,200,66,0.04);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.15s;
  flex-wrap: wrap;
}
.demo-row:hover { border-color: var(--border); background: rgba(245,200,66,0.08); }
.demo-row .role {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.demo-row .creds {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
}
.demo-hint {
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
  margin-top: 8px;
  font-style: italic;
}

.status-line {
  text-align: center;
  margin-top: 18px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── MOBILE ── */
@media (max-width: 500px) {
  .login-card { padding: 28px 22px; border-radius: 14px; }
  .brand-name { font-size: 18px; letter-spacing: 2px; }
  .brand-icon { width: 36px; height: 36px; }
  .demo-row { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="login-card">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 16 16" fill="none">
        <path d="M8 2L14 5.5V10.5L8 14L2 10.5V5.5L8 2Z" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M8 5L11 6.75V10.25L8 12L5 10.25V6.75L8 5Z" fill="#000" opacity="0.3"/>
      </svg>
    </div>
    <div class="brand-name">DROPELITE</div>
  </div>
  <div class="subtitle">SECURE ACCESS · COMMAND CENTER</div>

  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@dropelite.com">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn-login" id="loginBtn">SIGN IN</button>
  </form>

  <div class="demo-creds">
    <div class="demo-creds-label">⚡ Demo Accounts — tap to fill</div>
    <div class="demo-row" onclick="fillDemo('demo@dropelite.com','demo123')">
      <span class="role">User</span>
      <span class="creds">demo@dropelite.com · demo123</span>
    </div>
    <div class="demo-row" onclick="fillDemo('rejaul@dropelite.com','rejaul123')">
      <span class="role">Owner</span>
      <span class="creds">rejaul@dropelite.com · rejaul123</span>
    </div>
    <div class="demo-row" onclick="fillDemo('admin@dropelite.com','admin123')">
      <span class="role">Admin</span>
      <span class="creds">admin@dropelite.com · admin123</span>
    </div>
    <div class="demo-hint">Admin login → admin panel. Others → dashboard.</div>
  </div>

  <div class="status-line">
    <div class="status-dot"></div>
    SYSTEM ONLINE
  </div>
</div>

<script src="auth.js"></script>
<script>
function fillDemo(email, pass) {
  document.getElementById('email').value = email;
  document.getElementById('password').value = pass;
  document.getElementById('errorMsg').classList.remove('show');
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errorMsg');
  const email = document.getElementById('email').value;
  const pass  = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = 'SIGNING IN…';
  err.classList.remove('show');

  // Small delay for UX feel
  await new Promise(r => setTimeout(r, 350));

  const result = await Auth.login(email, pass);

  if (!result.ok) {
    err.textContent = result.error || 'Login failed.';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'SIGN IN';
    return;
  }

  // Route based on role
  if (result.user.role === 'admin') {
    location.href = 'admin.html';
  } else {
    location.href = 'dashboard.html';
  }
});

// If already logged in, skip the login page
if (Auth.isLoggedIn()) {
  const u = Auth.currentUser();
  if (u && u.role === 'admin') location.href = 'admin.html';
  else location.href = 'dashboard.html';
}
</script>
</body>
</html>
