<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DropElite — Secure Access</title>
<script>
(function(){var t=localStorage.getItem('dropelite_theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gold:        #f5c842;
  --gold-bright: #ffe066;
  --gold-dim:    #a8862a;
  --gold-glow:   rgba(245,200,66,0.18);
  --bg:          #050810;
  --bg2:         #080d1a;
  --surface:     rgba(255,255,255,0.04);
  --surface2:    rgba(255,255,255,0.07);
  --border:      rgba(245,200,66,0.15);
  --border2:     rgba(255,255,255,0.07);
  --text:        #e8eaf0;
  --text-dim:    #7a849a;
  --text-muted:  #3d4560;
  --green:       #00e87a;
  --red:         #ff4757;
  --blue:        #4af0ff;
}

[data-theme="light"] {
  --gold: #b8860b; --gold-bright: #d4a017; --gold-dim: #8b6914;
  --gold-glow: rgba(184,134,11,0.12);
  --bg: #f0f1f5; --bg2: #e4e6ec;
  --surface: rgba(0,0,0,0.04); --surface2: rgba(0,0,0,0.07);
  --border: rgba(184,134,11,0.22); --border2: rgba(0,0,0,0.09);
  --text: #1a1d28; --text-dim: #555d72; --text-muted: #8e95a8;
  --green: #00a858; --red: #d93545; --blue: #0094a8;
}
[data-theme="light"] .login-card { background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(244,245,250,0.94)); box-shadow: 0 20px 50px rgba(0,0,0,0.1), 0 0 0 1px rgba(184,134,11,0.08); }
[data-theme="light"] .top-status { background: rgba(240,241,245,0.9); }
[data-theme="light"] .brand-icon { box-shadow: 0 0 18px rgba(184,134,11,0.35); }
[data-theme="light"] .brand-name { text-shadow: none; }
[data-theme="light"] .logo { text-shadow: none; }
[data-theme="light"] .btn-login { color: #fff; box-shadow: 0 3px 14px rgba(184,134,11,0.25); }
[data-theme="light"] .demo-row { background: rgba(184,134,11,0.04); }
[data-theme="light"] .demo-row:hover { background: rgba(184,134,11,0.08); }
[data-theme="light"] #grid-canvas { opacity: 0.06; }
[data-theme="light"] .page-glow { opacity: 0.2; }
[data-theme="light"] .corner-accent.tl, [data-theme="light"] .corner-accent.tr,
[data-theme="light"] .corner-accent.bl, [data-theme="light"] .corner-accent.br { border-color: var(--gold); opacity: 0.3; }
[data-theme="light"] input { background: rgba(255,255,255,0.6); border-color: rgba(0,0,0,0.12); color: var(--text); }
[data-theme="light"] input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,134,11,0.1); }
[data-theme="light"] input::placeholder { color: var(--text-muted); }

html, body { overflow-x: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
}

/* ═══ ANIMATED GRID CANVAS ═══ */
#grid-canvas {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none; opacity: 0.35;
}

/* ═══ PAGE GLOW ATMOSPHERE ═══ */
.page-glow {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 50% 50% at 30% 20%, rgba(245,200,66,0.10) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 80% 80%, rgba(74,240,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 30% 40% at 50% 100%, rgba(255,71,87,0.03) 0%, transparent 60%);
}

/* ═══ HEX DECORATIONS (corner accents) ═══ */
.corner-accent {
  position: fixed;
  width: 120px; height: 120px;
  pointer-events: none;
  z-index: 1;
  opacity: 0.5;
}
.corner-accent.tl { top: 24px; left: 24px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.corner-accent.tr { top: 24px; right: 24px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }
.corner-accent.bl { bottom: 24px; left: 24px; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); }
.corner-accent.br { bottom: 24px; right: 24px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }

/* ═══ TOP SYSTEM STATUS BAR ═══ */
.top-status {
  position: fixed;
  top: 0; left: 0; right: 0;
  padding: 8px 20px;
  background: rgba(5,8,16,0.8);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.top-status-left, .top-status-right { display: flex; gap: 14px; align-items: center; }
.top-status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2s infinite;
}

/* ═══ LOGIN CARD ═══ */
.login-card {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 440px;
  background: linear-gradient(135deg, rgba(8,13,26,0.94) 0%, rgba(12,18,36,0.94) 100%);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 40px 34px 32px;
  box-shadow:
    0 30px 60px rgba(0,0,0,0.5),
    0 0 0 1px rgba(245,200,66,0.05),
    0 0 80px rgba(245,200,66,0.06),
    inset 0 1px 0 rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
}

/* Top accent line on card */
.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 24px; right: 24px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  border-radius: 2px;
}

/* Corner brackets on card */
.login-card::after {
  content: '';
  position: absolute;
  top: -1px; left: -1px;
  width: 24px; height: 24px;
  border-top: 2px solid var(--gold);
  border-left: 2px solid var(--gold);
  border-top-left-radius: 18px;
  pointer-events: none;
}

.card-corner-br {
  position: absolute;
  bottom: -1px; right: -1px;
  width: 24px; height: 24px;
  border-bottom: 2px solid var(--gold);
  border-right: 2px solid var(--gold);
  border-bottom-right-radius: 18px;
  pointer-events: none;
}

/* ═══ BRAND ═══ */
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
  justify-content: center;
  margin-bottom: 8px;
}
.brand-icon {
  width: 46px; height: 46px;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
  clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 28px rgba(245,200,66,0.6);
  animation: brand-pulse 3s ease-in-out infinite;
}
@keyframes brand-pulse {
  0%, 100% { box-shadow: 0 0 28px rgba(245,200,66,0.6); }
  50% { box-shadow: 0 0 38px rgba(245,200,66,0.85); }
}
.brand-icon svg { width: 24px; height: 24px; }
.brand-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 3.5px;
  color: var(--gold);
  text-shadow: 0 0 22px rgba(245,200,66,0.5);
}

.subtitle {
  text-align: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 2.5px;
  color: var(--text-muted);
  margin-bottom: 32px;
  text-transform: uppercase;
  position: relative;
}
.subtitle::before,
.subtitle::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 30px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border));
}
.subtitle::before { left: 20px; }
.subtitle::after { right: 20px; transform: scaleX(-1); }

/* ═══ FORM ═══ */
.field {
  margin-bottom: 18px;
  position: relative;
}
.field label {
  display: block;
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-dim);
  text-transform: uppercase;
  margin-bottom: 7px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.field label::before {
  content: '';
  width: 4px; height: 4px;
  background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--gold);
}
.field input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 13px 16px;
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  font-size: 15px;
  font-weight: 500;
  outline: none;
  transition: all 0.2s;
  min-height: 46px;
  letter-spacing: 0.5px;
}
.field input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-glow), 0 0 18px rgba(245,200,66,0.15);
  background: var(--surface2);
}
.field input::placeholder { color: var(--text-muted); }

/* ═══ ERROR ═══ */
.error-msg {
  display: none;
  background: rgba(255,71,87,0.1);
  border: 1px solid rgba(255,71,87,0.3);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--red);
  font-size: 13px;
  margin-bottom: 16px;
  font-family: 'Share Tech Mono', monospace;
  letter-spacing: 0.5px;
}
.error-msg.show { display: block; animation: errorShake 0.4s; }
@keyframes errorShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* ═══ SIGN IN BUTTON ═══ */
.btn-login {
  width: 100%;
  background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
  color: #050810;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 50px;
  box-shadow: 0 4px 18px rgba(245,200,66,0.3);
  margin-top: 8px;
  position: relative;
  overflow: hidden;
}
.btn-login::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.5s;
}
.btn-login:hover::before { left: 100%; }
.btn-login:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 28px rgba(245,200,66,0.5);
}
.btn-login:active { transform: translateY(0); }
.btn-login:disabled { opacity: 0.5; cursor: wait; }

/* ═══ DEMO CREDENTIALS ═══ */
.demo-creds {
  margin-top: 26px;
  padding-top: 24px;
  border-top: 1px solid var(--border2);
}
.demo-creds-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.demo-creds-label::before,
.demo-creds-label::after {
  content: '';
  flex: 1; max-width: 50px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border));
}
.demo-creds-label::after { transform: scaleX(-1); }

.demo-row {
  background: rgba(245,200,66,0.04);
  border: 1px solid var(--border2);
  border-radius: 9px;
  padding: 11px 13px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.15s;
  flex-wrap: wrap;
  position: relative;
}
.demo-row:hover {
  border-color: var(--border);
  background: rgba(245,200,66,0.08);
  transform: translateX(2px);
}
.demo-row .role {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--gold);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: rgba(245,200,66,0.05);
}
.demo-row[data-role="admin"] .role { color: var(--red); border-color: rgba(255,71,87,0.3); background: rgba(255,71,87,0.05); }
.demo-row .creds {
  font-family: 'Share Tech Mono', monospace;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}
.demo-hint {
  font-size: 10px;
  color: var(--text-muted);
  text-align: center;
  margin-top: 10px;
  font-family: 'Share Tech Mono', monospace;
  letter-spacing: 1px;
}

/* ═══ STATUS LINE ═══ */
.status-line {
  text-align: center;
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--border2);
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1.5px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ═══ SCROLLBAR ═══ */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(245,200,66,0.2); border-radius: 3px; }

/* ═══ MOBILE ═══ */
@media (max-width: 500px) {
  body { padding: 14px; padding-top: 50px; padding-bottom: 14px; }
  .top-status { padding: 7px 14px; font-size: 9px; letter-spacing: 1px; }
  .top-status-right .top-status-time { display: none; }
  .corner-accent { width: 70px; height: 70px; }
  .corner-accent.tl, .corner-accent.tr { top: 40px; }
  .corner-accent.tl { left: 14px; }
  .corner-accent.tr { right: 14px; }
  .corner-accent.bl { left: 14px; bottom: 14px; }
  .corner-accent.br { right: 14px; bottom: 14px; }
  .login-card { padding: 32px 24px 26px; border-radius: 16px; }
  .brand-name { font-size: 20px; letter-spacing: 2.5px; }
  .brand-icon { width: 40px; height: 40px; }
  .brand-icon svg { width: 20px; height: 20px; }
  .demo-row { flex-direction: column; align-items: flex-start; gap: 5px; }
  .demo-row .role { font-size: 9px; }
  .demo-row .creds { font-size: 10px; }
}

@media (max-width: 380px) {
  .corner-accent { display: none; }
  .login-card { padding: 28px 20px 22px; }
  .brand { gap: 10px; }
  .brand-name { font-size: 18px; letter-spacing: 2px; }
  .subtitle { font-size: 9px; letter-spacing: 2px; }
  .subtitle::before, .subtitle::after { display: none; }
}
</style>
</head>
<body>

<canvas id="grid-canvas"></canvas>
<div class="page-glow"></div>

<!-- Top status bar -->
<div class="top-status">
  <div class="top-status-left">
    <div class="top-status-dot"></div>
    <span>SYSTEM ONLINE · v2.4.1</span>
  </div>
  <div class="top-status-right">
    <span class="top-status-time" id="topTime">--:--:--</span>
    <span>SECURE CHANNEL</span>
    <button onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme" style="background:none;border:1px solid var(--border2);border-radius:6px;width:28px;height:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);padding:0;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--gold)';this.style.color='var(--gold)'" onmouseout="this.style.borderColor='';this.style.color=''">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
  </div>
</div>

<!-- Corner accents -->
<div class="corner-accent tl"></div>
<div class="corner-accent tr"></div>
<div class="corner-accent bl"></div>
<div class="corner-accent br"></div>

<!-- Login card -->
<div class="login-card">
  <div class="card-corner-br"></div>

  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 16 16" fill="none">
        <path d="M8 2L14 5.5V10.5L8 14L2 10.5V5.5L8 2Z" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M8 5L11 6.75V10.25L8 12L5 10.25V6.75L8 5Z" fill="#000" opacity="0.3"/>
      </svg>
    </div>
    <div class="brand-name">DROPELITE</div>
  </div>
  <div class="subtitle">SECURE ACCESS · COMMAND CENTER</div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="error-msg" id="okMsg" style="background:rgba(0,232,122,0.1);border-color:rgba(0,232,122,0.3);color:var(--green);"></div>

  <form id="loginForm" autocomplete="on">
    <div class="field" id="nameField" style="display:none;">
      <label for="name">Operator Name</label>
      <input type="text" id="name" name="name" autocomplete="name" placeholder="Your name">
    </div>
    <div class="field">
      <label for="email">Email Identity</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="operator@dropelite.com">
    </div>
    <div class="field">
      <label for="password">Access Key</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn-login" id="loginBtn">SIGN IN</button>
  </form>

  <div class="demo-creds">
    <div class="demo-creds-label" id="toggleLabel">⚡ Need an account?</div>
    <div class="demo-row" data-role="user" onclick="toggleMode()" style="justify-content:center;">
      <span class="role" id="toggleBtn">CREATE ACCOUNT</span>
    </div>
    <div class="demo-hint" id="modeHint">New here? Create your DropElite account.</div>
  </div>

  <div class="status-line">
    <div class="status-dot"></div>
    ENCRYPTED · READY FOR INPUT
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="api.js"></script>
<script src="auth.js"></script>
<script>
function toggleTheme(){
  var h=document.documentElement;
  var isLight=h.getAttribute('data-theme')==='light';
  if(isLight){h.removeAttribute('data-theme');localStorage.setItem('dropelite_theme','dark');}
  else{h.setAttribute('data-theme','light');localStorage.setItem('dropelite_theme','light');}
}
</script>
<script>
/* ═══ ANIMATED GRID CANVAS ═══ */
(function() {
  const canvas = document.getElementById('grid-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  function draw() {
    ctx.clearRect(0, 0, W, H);
    const spacing = 48;
    const t = Date.now() * 0.0003;
    ctx.strokeStyle = 'rgba(245,200,66,0.12)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < W; x += spacing) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += spacing) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(245,200,66,0.25)';
    for (let x = 0; x < W; x += spacing) {
      for (let y = 0; y < H; y += spacing) {
        const wave = Math.sin(t + x * 0.02 + y * 0.02);
        if (wave > 0.7) { ctx.beginPath(); ctx.arc(x, y, 1.2, 0, Math.PI * 2); ctx.fill(); }
      }
    }
    const scanY = ((Date.now() * 0.05) % H);
    const grad = ctx.createLinearGradient(0, scanY - 60, 0, scanY + 60);
    grad.addColorStop(0, 'transparent');
    grad.addColorStop(0.5, 'rgba(245,200,66,0.04)');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0, scanY - 60, W, 120);
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ═══ TIME CLOCK ═══ */
function updateTime() {
  const t = new Date();
  const hh = String(t.getUTCHours()).padStart(2, '0');
  const mm = String(t.getUTCMinutes()).padStart(2, '0');
  const ss = String(t.getUTCSeconds()).padStart(2, '0');
  const el = document.getElementById('topTime');
  if (el) el.textContent = hh + ':' + mm + ':' + ss + ' UTC';
}
updateTime();
setInterval(updateTime, 1000);

/* ═══ MODE: 'signin' or 'signup' ═══ */
let authMode = 'signin';

function toggleMode() {
  authMode = (authMode === 'signin') ? 'signup' : 'signin';
  const nameField   = document.getElementById('nameField');
  const loginBtn    = document.getElementById('loginBtn');
  const toggleLabel = document.getElementById('toggleLabel');
  const toggleBtn   = document.getElementById('toggleBtn');
  const modeHint    = document.getElementById('modeHint');
  document.getElementById('errorMsg').classList.remove('show');
  document.getElementById('okMsg').classList.remove('show');

  if (authMode === 'signup') {
    nameField.style.display = 'block';
    loginBtn.textContent = 'CREATE ACCOUNT';
    toggleLabel.textContent = '⚡ Already have an account?';
    toggleBtn.textContent = 'SIGN IN INSTEAD';
    modeHint.textContent = 'Fill in your details to create an account.';
  } else {
    nameField.style.display = 'none';
    loginBtn.textContent = 'SIGN IN';
    toggleLabel.textContent = '⚡ Need an account?';
    toggleBtn.textContent = 'CREATE ACCOUNT';
    modeHint.textContent = 'New here? Create your DropElite account.';
  }
}

/* ═══ FORM SUBMIT — handles both sign in and sign up ═══ */
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn   = document.getElementById('loginBtn');
  const err   = document.getElementById('errorMsg');
  const okMsg = document.getElementById('okMsg');
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('password').value;
  const name  = document.getElementById('name').value.trim();

  err.classList.remove('show');
  okMsg.classList.remove('show');
  btn.disabled = true;

  // ─── SIGN UP ───
  if (authMode === 'signup') {
    btn.textContent = 'CREATING…';
    if (pass.length < 6) {
      err.textContent = '⚠ Password must be at least 6 characters.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'CREATE ACCOUNT';
      return;
    }
    const result = await Auth.signUp(email, pass, name);
    if (!result.ok) {
      err.textContent = '⚠ ' + (result.error || 'Sign up failed.');
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'CREATE ACCOUNT';
      return;
    }
    // Account created — now sign them in automatically
    okMsg.textContent = '✓ Account created! Signing you in…';
    okMsg.classList.add('show');
    const loginResult = await Auth.login(email, pass);
    btn.disabled = false;
    if (loginResult.ok) {
      btn.textContent = 'ACCESS GRANTED ✓';
      setTimeout(() => {
        location.href = (loginResult.user.role === 'admin') ? 'admin.html' : 'dashboard.html';
      }, 500);
    } else {
      // Sign-up worked but auto-login didn't — ask them to sign in manually
      okMsg.textContent = '✓ Account created! Please sign in.';
      toggleMode();
      btn.textContent = 'SIGN IN';
    }
    return;
  }

  // ─── SIGN IN ───
  btn.textContent = 'AUTHENTICATING…';
  const result = await Auth.login(email, pass);
  if (!result.ok) {
    err.textContent = '⚠ ' + (result.error || 'Access denied.');
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'SIGN IN';
    return;
  }
  btn.textContent = 'ACCESS GRANTED ✓';
  setTimeout(() => {
    location.href = (result.user.role === 'admin') ? 'admin.html' : 'dashboard.html';
  }, 350);
});

/* ═══ AUTO-REDIRECT IF ALREADY LOGGED IN ═══ */
(async function() {
  // small wait so Supabase client is ready
  await new Promise(r => setTimeout(r, 300));
  if (window.Auth && await Auth.isLoggedIn()) {
    const u = await Auth.currentUserLive();
    if (u && u.role === 'admin') location.href = 'admin.html';
    else location.href = 'dashboard.html';
  }
})();
</script>
